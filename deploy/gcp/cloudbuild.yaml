# Cloud Build configuration for CPQAI on Google Cloud
#
# Usage:
#   gcloud builds submit --config deploy/gcp/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_DB_HOST=10.128.0.2 .
#
# Substitutions (override with --substitutions):
#   _REGION          – GCP region (default: us-central1)
#   _SERVICE_NAME    – Cloud Run service name (default: cpqai)
#   _REPO_NAME       – Artifact Registry repo (default: cpqai)
#   _TAG             – Image tag (default: latest)
#   _DB_HOST         – PostgreSQL VM internal IP (required)
#   _DB_NAME         – Database name (default: cpqai)
#   _DB_USER         – Database user (default: cpqai)
#   _VPC_NETWORK     – VPC network (default: default)
#   _VPC_SUBNET      – VPC subnet (default: default)

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: cpqai
  _REPO_NAME: cpqai
  _TAG: latest
  _DB_HOST: ""
  _DB_NAME: cpqai
  _DB_USER: cpqai
  _VPC_NETWORK: default
  _VPC_SUBNET: default

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

steps:
  # ── Build container image (BuildKit required for --mount=type=cache) ─
  - name: gcr.io/cloud-builders/docker
    id: build
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest
      - .

  # ── Push to Artifact Registry ──────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}

  # ── Deploy to Cloud Run ────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --service-account=${_SERVICE_NAME}-sa@${PROJECT_ID}.iam.gserviceaccount.com
      - --update-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,POSTGRES_HOST=${_DB_HOST},POSTGRES_USER=${_DB_USER},POSTGRES_DATABASE=${_DB_NAME}
      # Direct VPC egress — Cloud Run connects to the DB VM's internal IP
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      # Secrets from Secret Manager
      - --update-secrets=POSTGRES_PASSWORD=cpqai-db-password:latest,LIGHTRAG_API_KEY=cpqai-api-key:latest
      - --memory=4Gi
      - --cpu=2
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=300s

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest
